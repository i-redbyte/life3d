[versions]
agp = "9.0.1"
kotlin = "2.3.10"
redbytefx = "1.2.0"
compose-bom = "2026.02.01"
activity-compose = "1.12.4"
lifecycle = "2.9.0"
junit4 = "4.13.2"
androidx-test = "1.6.2"
androidx-test-ext = "1.2.1"

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }

[libraries]
redbytefx-core = { module = "io.github.i-redbyte:redbytefx-core", version.ref = "redbytefx" }
redbytefx-stdlib = { module = "io.github.i-redbyte:redbytefx-stdlib", version.ref = "redbytefx" }
redbytefx-gl = { module = "io.github.i-redbyte:redbytefx-gl", version.ref = "redbytefx" }
redbytefx-gl-compose = { module = "io.github.i-redbyte:redbytefx-gl-compose", version.ref = "redbytefx" }
redbytefx-scene = { module = "io.github.i-redbyte:redbytefx-3d", version.ref = "redbytefx" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "compose-bom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-foundation = { module = "androidx.compose.foundation:foundation" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activity-compose" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
junit4 = { module = "junit:junit", version.ref = "junit4" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext" }
